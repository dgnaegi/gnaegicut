<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Used by the ffmpeg bundled in GnaegiCut.app, where Homebrew's fontconfig setup is missing. -->
<fontconfig>
	<dir>/System/Library/Fonts</dir>
	<dir>/Library/Fonts</dir>
	<dir>~/Library/Fonts</dir>
	<dir>/System/Library/AssetsV2/com_apple_MobileAsset_Font7</dir>
	<cachedir>~/Library/Caches/GnaegiCut/fontconfig</cachedir>
</fontconfig>
